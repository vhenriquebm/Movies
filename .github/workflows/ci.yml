name: Build & Test iOS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Verificar arquivos do projeto
        run: |
          echo "Diretório atual:"
          pwd
          echo "Conteúdo do diretório atual:"
          ls -la
          echo "Buscando arquivos .xcodeproj..."
          find . -name "*.xcodeproj"
          echo "Se encontrado, aqui está o conteúdo de project.pbxproj:"
          find . -name "project.pbxproj" -exec cat {} \;

      - name: Mostrar estrutura de pastas
        run: |
          brew install tree || echo "tree já instalado"
          tree -a -L 3

      - name: Mostrar versão do Xcode
        run: xcodebuild -version

      - name: Mostrar versão do Swift
        run: swift --version

      - name: Definir versão do Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.2.app

      - name: Mostrar destinos disponíveis (debug)
        run: |
          xcodebuild -project Movies.xcodeproj -scheme Movies -showdestinations

      - name: Build do Projeto
        run: |
          xcodebuild \
            -project Movies.xcodeproj \
            -scheme Movies \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.2' \
            clean build | tee build.log

      - name: Run Tests
        run: |
          xcodebuild \
            -project Movies.xcodeproj \
            -scheme Movies \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.2' \
            test | tee test.log
        continue-on-error: true

      - name: Upload logs como artefatos
        uses: actions/upload-artifact@v3
        with:
          name: build-and-test-logs
          path: |
            build.log
            test.log
