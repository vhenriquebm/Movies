name: Build & Test iOS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Verificar arquivos do projeto
        run: |
          echo "Diretório atual:"
          pwd
          echo "Conteúdo do diretório atual:"
          ls -la
          echo "Buscando arquivos .xcodeproj..."
          find . -name "*.xcodeproj"
          echo "Se encontrado, aqui está o conteúdo de project.pbxproj:"
          find . -name "project.pbxproj" -exec cat {} \;

      - name: Mostrar estrutura de pastas
        run: |
          brew install tree || echo "tree já instalado"
          tree -a -L 3

      - name: Mostrar versao do Xcode
        run: xcodebuild -version

      - name: Mostrar versao do Swift
        run: swift --version

      - name: Definir Versao do Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.2.app

      - name: Build do Projeto
        run: |
          xcodebuild \
            -project Movies.xcodeproj \
            -scheme Movies \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.2' \
            clean build

      - name: Run tests
        run: |
          xcodebuild \
            -project Movies.xcodeproj \
            -scheme Movies \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.2' \
            test
        continue-on-error: true
